# Preproduction. Its own Compose project, started by infra/scripts/deploy.sh preproduction:
#   docker compose -f infra/preproduction/compose.yml --env-file /srv/ppf/preproduction/.env up -d
# Same layout as production, with lower limits. Reachable only through the proxy, which answers
# only to the devices of the WireGuard tunnel. Fictional data only ([EXEMPLE]).
#
# Variables (file /srv/ppf/preproduction/.env on the server, never in the repository; model in
# infra/env/preproduction.env.example):
# - PPF_SERVER_IMAGE: image to run, always by digest (set by deploy.sh);
# - PPF_SECRETS_DIR: directory holding the database password files (outside the repository);
# - POSTGRES_DB, POSTGRES_USER;
# - PPF_EDITOR_KEYS: keys allowed to publish editorial contents (the example editor key here).

name: ppf-preprod

services:
  server:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    restart: unless-stopped
    # A UID of its own, distinct from the production one (10001).
    user: "10002:10002"
    read_only: true
    # The only writable place. "exec": the signature library (secp256k1) unpacks its native code
    # there before loading it, which Docker's default tmpfs options (noexec) would forbid.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      PPF_ENVIRONMENT: preproduction
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      # The restricted role ppf_app (D-127): ordinary reads and writes, never a change of schema,
      # never UPDATE, DELETE or TRUNCATE on the audit log. Migrations run before, in the one-shot
      # service "migrate" below, with the owner role; the server only checks that none is pending.
      DATABASE_USER: ppf_app
      DATABASE_PASSWORD_FILE: /run/secrets/server_db_password
      PPF_DATABASE_MIGRATE: "false"
      PPF_EDITOR_KEYS: ${PPF_EDITOR_KEYS:-}
      # Team back-office (docs/integration/back-office.md): off without its origin; its routes answer
      # only on the second port, which only the proxy reaches (equipe.<domain>, tunnel only).
      PPF_BACKOFFICE_ORIGIN: ${PPF_BACKOFFICE_ORIGIN:-}
      PPF_BACKOFFICE_PORT: "8081"
      PPF_AUDIT_PUBLIC_KEY: ${PPF_AUDIT_PUBLIC_KEY:-}
      # Exact public address of this environment (votes: NIP-98 authorisations name it, D-110).
      PPF_PUBLIC_URL: ${PPF_PUBLIC_URL:?}
      # Seeds of the vote keys, one read-only file per version (Décider, D-110), never in a variable.
      PPF_VOTE_SEEDS_DIR: /run/ppf/vote_seeds
      # Fictional example contents, bundled in the image, loaded at each start (idempotent).
      PPF_EXAMPLES_DIR: /app/examples
      # Real public information in the preproduction too (owner's decision of 7 November 2026: "on reste
      # dans la vraie info même en preprod"), never personal data of citizens.
      PPF_RNE_SOURCE: official
      PPF_TERRITOIRES_SOURCE: official
      # Parliamentary open data: the packages written by the importer below once the preproduction
      # import key exists and the test builds trust it (OpenDataKeys.PREPRODUCTION); until then the
      # example packages of the image (set PPF_OPEN_DATA_DIR=/data/open-data in .env to switch).
      PPF_OPEN_DATA_DIR: ${PPF_OPEN_DATA_DIR:-/app/parlement-examples}
    # Private anti-fraud settings (proof-of-work thresholds and limits of the votes, D-110): a file
    # on the server only, never in the repository (model: infra/env/private.env.example).
    env_file:
      - path: /srv/ppf/preproduction/private.env
        required: false
    secrets:
      - server_db_password
    volumes:
      - /srv/ppf/preproduction/open-data:/data/open-data:ro
      - /srv/ppf/preproduction/vote_seeds:/run/ppf/vote_seeds:ro
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Database migrations, run once per deployment by infra/scripts/deploy.sh before the server
  # starts (docker compose run --rm migrate); never started by "up" (profile "tools").
  migrate:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    profiles: ["tools"]
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["java", "-Xmx128m", "-cp", "/app/ppf-server.jar", "org.politisationpopulairefrancaise.server.db.DatabaseCli", "migrate"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      DATABASE_USER: ${POSTGRES_USER:?}
      DATABASE_PASSWORD_FILE: /run/secrets/migrate_db_password
      PPF_DATABASE_APP_ROLE: ppf_app
    secrets:
      - migrate_db_password
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Importer of the parliamentary open data (Voir, D-064), one-shot, started by the systemd timers
  # ppf-open-data-daily@preproduction and ppf-open-data-weekly@preproduction (never by "up", profile "tools"). Its own
  # UID, the only one able to read the import key; it writes the packages the server reads.
  # Official mode with the preproduction key (OpenDataKeys.PREPRODUCTION), never the example key.
  open-data-importer:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    profiles: ["tools"]
    user: "10004:10004"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Measured on the real files on 7 November 2026: peak 316 MB with a 256 MB heap.
    entrypoint: ["java", "-Xmx256m", "-XX:+ExitOnOutOfMemoryError", "-jar", "/app/ppf-open-data-importer.jar"]
    healthcheck:
      disable: true
    environment:
      PPF_OPEN_DATA_SOURCE: official
      PPF_OPEN_DATA_DIR: /data/open-data
      PPF_IMPORT_KEY_FILE: /run/secrets/import_key
    secrets:
      - import_key
    volumes:
      - /srv/ppf/preproduction/open-data:/data/open-data
    # Its own network, with a way out (official sources only, infra/EGRESS.md); never the database.
    networks:
      - importer
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  db:
    # PostgreSQL 17 with PostGIS, pinned by digest (Dependabot proposes updates).
    image: postgis/postgis:17-3.6@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # Small settings for a small machine; nothing is logged about clients.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    shm_size: 64m
    secrets:
      - db_password
      - app_db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the restricted role ppf_app at the first initialisation of the volume.
      - ../postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

# Two passwords (owner role and restricted role ppf_app), each in one file per container user
# (10002 for the server and the migrations, 999 for PostgreSQL): file secrets are bind mounts, so
# Compose cannot change their owner. All four files are written by infra/scripts/bootstrap-server.sh.
secrets:
  server_db_password:
    file: ${PPF_SECRETS_DIR:?}/server_db_password
  migrate_db_password:
    file: ${PPF_SECRETS_DIR:?}/migrate_db_password
  db_password:
    file: ${PPF_SECRETS_DIR:?}/db_password
  app_db_password:
    file: ${PPF_SECRETS_DIR:?}/app_db_password
  # Import key of the parliamentary open data (nsec file, UID 10004), generated on the server.
  import_key:
    file: ${PPF_SECRETS_DIR:?}/import_key

volumes:
  db-data:

networks:
  # The database network has no way out.
  internal:
    internal: true
  # Shared with the proxy only; created once by infra/scripts/bootstrap-server.sh.
  edge:
    external: true
    name: ppf-preprod-edge
  # The importer's own network, with a way out to the official sources only.
  importer: {}
