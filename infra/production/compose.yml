# Production. Its own Compose project, started by infra/scripts/deploy.sh production, only with
# an image digest already validated on the preproduction:
#   docker compose -f infra/production/compose.yml --env-file /srv/ppf/production/.env up -d
# Nothing here is shared with the preproduction, except the proxy (edge network).
#
# Variables (file /srv/ppf/production/.env on the server, never in the repository; model in
# infra/env/production.env.example):
# - PPF_SERVER_IMAGE: image to run, always by digest (set by deploy.sh);
# - PPF_SECRETS_DIR: directory holding the database password files (outside the repository);
# - POSTGRES_DB, POSTGRES_USER;
# - PPF_EDITOR_KEYS: keys of the editorial team (never the example key).

name: ppf-prod

services:
  server:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    restart: unless-stopped
    # A UID of its own, distinct from the preproduction one (10002).
    user: "10001:10001"
    read_only: true
    # The only writable place. "exec": the signature library (secp256k1) unpacks its native code
    # there before loading it, which Docker's default tmpfs options (noexec) would forbid.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      PPF_ENVIRONMENT: production
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      # The restricted role ppf_app (D-127): ordinary reads and writes, never a change of schema,
      # never UPDATE, DELETE or TRUNCATE on the audit log. Migrations run before, in the one-shot
      # service "migrate" below, with the owner role; the server only checks that none is pending.
      DATABASE_USER: ppf_app
      DATABASE_PASSWORD_FILE: /run/secrets/server_db_password
      PPF_DATABASE_MIGRATE: "false"
      PPF_EDITOR_KEYS: ${PPF_EDITOR_KEYS:-}
      # Team back-office (docs/integration/back-office.md): off without its origin; its routes answer
      # only on the second port, which only the proxy reaches (equipe.<domain>, tunnel only).
      PPF_BACKOFFICE_ORIGIN: ${PPF_BACKOFFICE_ORIGIN:-}
      PPF_BACKOFFICE_PORT: "8081"
      PPF_AUDIT_PUBLIC_KEY: ${PPF_AUDIT_PUBLIC_KEY:-}
      # Exact public address of this environment (votes: NIP-98 authorisations name it, D-110).
      PPF_PUBLIC_URL: ${PPF_PUBLIC_URL:?}
      # How researchers report a vulnerability (S-92, security.txt): the public key of the security contact
      # (encrypted NIP-17 messages) and, once the repository is on GitHub, its private reporting page. In
      # production the server refuses to start without one of them.
      PPF_SECURITY_NOSTR_KEY: ${PPF_SECURITY_NOSTR_KEY:-}
      PPF_SECURITY_GITHUB_URL: ${PPF_SECURITY_GITHUB_URL:-}
      # Seeds of the vote keys, one read-only file per version (Décider, D-110), never in a variable.
      PPF_VOTE_SEEDS_DIR: /run/ppf/vote_seeds
      # Push wake-ups (D-078): only our ntfy is an allowed endpoint; the server reaches it inside, never
      # through its public name; the VAPID key is a file secret generated on the server.
      PPF_PUSH_ALLOWED_HOSTS: push.politisation-populaire-francaise.org
      PPF_PUSH_INTERNAL_URL: http://ntfy:8080
      PPF_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      # Testimonies (Agir, M5): files encrypted on the device for the moderation and evidence keys,
      # only stored here (4 GB at most by default); the public keys are set in .env.
      # The separate signing service (D-129), reached on the internal network "signing" only.
      PPF_SIGNER_URL: http://signer:8090
      PPF_SIGNER_CLIENT_TOKEN_FILE: /run/secrets/server_signer_token
      # Root of this environment (D-079), the same as the signing service's: what the server accepts back from it.
      PPF_SIGNER_ROOT_PUBKEY: ${PPF_SIGNER_ROOT_PUBKEY:-}
      PPF_TESTIMONY_DIR: /data/testimonies
      PPF_MODERATION_KEY: ${PPF_MODERATION_KEY:-}
      PPF_EVIDENCE_KEY: ${PPF_EVIDENCE_KEY:-}
      # Contact and claims (M30, D-140): public key of the inbox of the team, the one built into the app;
      # empty: the routes /api/v1/cases answer 503. Proof of work asked to open a case (16 bits when empty).
      PPF_CONTACT_INBOX_KEY: ${PPF_CONTACT_INBOX_KEY:-}
      PPF_CASE_POW_BITS: ${PPF_CASE_POW_BITS:-}
      # No PPF_EXAMPLES_DIR here: the server refuses to start in production with it.
      # Parliamentary open data written by the importer below, read-only for the server.
      PPF_OPEN_DATA_DIR: /data/open-data
      # Official public sources in production only (Comprendre, D-047 and D-090; hosts in infra/EGRESS.md).
      PPF_RNE_SOURCE: official
      PPF_TERRITOIRES_SOURCE: official
    # Private anti-fraud settings (proof-of-work thresholds and limits of the votes, D-110): a file
    # on the server only, never in the repository (model: infra/env/private.env.example).
    env_file:
      - path: /srv/ppf/production/private.env
        required: false
    secrets:
      - server_db_password
      - vapid_private_key
      - server_signer_token
    volumes:
      - /srv/ppf/production/open-data:/data/open-data:ro
      - /srv/ppf/production/vote_seeds:/run/ppf/vote_seeds:ro
      - /srv/ppf/production/testimonies:/data/testimonies
    networks:
      - internal
      - edge
      - signing
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # Database migrations, run once per deployment by infra/scripts/deploy.sh before the server
  # starts (docker compose run --rm migrate); never started by "up" (profile "tools").
  migrate:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    profiles: ["tools"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["java", "-Xmx128m", "-cp", "/app/ppf-server.jar", "org.politisationpopulairefrancaise.server.db.DatabaseCli", "migrate"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      DATABASE_USER: ${POSTGRES_USER:?}
      DATABASE_PASSWORD_FILE: /run/secrets/migrate_db_password
      PPF_DATABASE_APP_ROLE: ppf_app
    secrets:
      - migrate_db_password
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Importer of the parliamentary open data (Voir, D-064), one-shot, started by the systemd timers
  # ppf-open-data-daily@production and ppf-open-data-weekly@production (never by "up", profile "tools"). Its own UID, the
  # only one able to read the import key; it writes the packages the server reads. Enabled only at the
  # public launch, once the production import key exists (OpenDataKeys, infra/README.md).
  open-data-importer:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    profiles: ["tools"]
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Measured on the real files on 7 November 2026: peak 316 MB with a 256 MB heap.
    entrypoint: ["java", "-Xmx256m", "-XX:+ExitOnOutOfMemoryError", "-jar", "/app/ppf-open-data-importer.jar"]
    healthcheck:
      disable: true
    environment:
      PPF_OPEN_DATA_SOURCE: official
      PPF_OPEN_DATA_DIR: /data/open-data
      PPF_IMPORT_KEY_FILE: /run/secrets/import_key
      # Parrainages de la présidentielle (VO-37): the dataset of 2027 on data.gouv.fr, empty until the decree of convocation.
      PPF_SPONSORSHIPS_DATASET: ${PPF_SPONSORSHIPS_DATASET:-}
    secrets:
      - import_key
    volumes:
      - /srv/ppf/production/open-data:/data/open-data
    # Its own network, with a way out (official sources only, infra/EGRESS.md); never the database.
    networks:
      - importer
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Push wake-ups (Communauté, M31, docs/integration/notifications.md, D-078): self-hosted ntfy, the
  # UnifiedPush distributor of the Android app. It never contacts anyone (no upstream, never ntfy.sh),
  # keeps the constant encrypted wake-ups 12 hours at most, and never sees a client address (the proxy
  # strips it). Only random topics "up*" are open; everything else is refused.
  ntfy:
    image: binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
    restart: unless-stopped
    command: ["serve"]
    user: "10005:10005"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NTFY_BASE_URL: https://push.politisation-populaire-francaise.org
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_LOGIN: "false"
      NTFY_ENABLE_RESERVATIONS: "false"
      NTFY_WEB_ROOT: disable
      NTFY_UPSTREAM_BASE_URL: ""
      NTFY_BEHIND_PROXY: "false"
      NTFY_LOG_LEVEL: warn
      # Every visitor reaches ntfy through the proxy, which strips the client address: ntfy sees one
      # visitor only, so its per-visitor limits act as one global ceiling, sized for the whole platform.
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "2000"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "50ms"
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "100000"
      NTFY_VISITOR_MESSAGE_DAILY_LIMIT: "0"
    volumes:
      - /srv/ppf/production/ntfy:/var/lib/ntfy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O - http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # Platform signing service (D-079, D-129, docs/integration/service-signature.md): holds the working keys,
  # signs only what its rules and the approvals allow. Its own UID, read-only filesystem except its data,
  # no way out to the Internet (internal network shared with the server only), keys encrypted at rest.
  signer:
    image: ${PPF_SERVER_IMAGE:?set by infra/scripts/deploy.sh}
    restart: unless-stopped
    user: "10007:10007"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["java", "-Xmx128m", "-XX:+ExitOnOutOfMemoryError", "-jar", "/app/ppf-signer.jar"]
    environment:
      PPF_SIGNER_HOST: 0.0.0.0
      PPF_SIGNER_PORT: "8090"
      PPF_SIGNER_DATA_DIR: /data/signer
      PPF_SIGNER_KEK_FILE: /run/secrets/signer_kek
      PPF_SIGNER_CLIENT_TOKEN_FILE: /run/secrets/signer_client_token
      # Public key of the root of this environment (a root of its own for the preproduction); empty until
      # the owner has created it on her phone: then nothing is signed.
      PPF_SIGNER_ROOT_PUBKEY: ${PPF_SIGNER_ROOT_PUBKEY:-}
      # Approvals are given on the signing service's own pages (port 8091, through the proxy), never on the
      # back-office: the main server can neither choose what is approved nor speak for that origin.
      PPF_SIGNER_APPROVAL_PORT: "8091"
      PPF_SIGNER_APPROVAL_ORIGIN: ${PPF_SIGNER_APPROVAL_ORIGIN:-}
      PPF_SIGNER_RP_ID: ${PPF_SIGNER_RP_ID:-}
      PPF_SIGNER_BACKOFFICE_ORIGIN: ${PPF_BACKOFFICE_ORIGIN:-}
      PPF_ENVIRONMENT: production
    secrets:
      - signer_kek
      - signer_client_token
    volumes:
      - /srv/ppf/production/signer:/data/signer
    networks:
      - signing
      - approval
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

  db:
    # PostgreSQL 17 with PostGIS, pinned by digest (Dependabot proposes updates).
    image: postgis/postgis:17-3.6@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # Small settings for a small machine; nothing is logged about clients.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=50
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      # No trace that could link accounts to the order of operations (Décider, validations, D-112):
      # no commit timestamps, no WAL archiving or point-in-time recovery, the smallest WAL; backups are
      # logical dumps only (infra/scripts/backup.md).
      - -c
      - track_commit_timestamp=off
      - -c
      - archive_mode=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - wal_keep_size=0
    shm_size: 128m
    secrets:
      - db_password
      - app_db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the restricted role ppf_app at the first initialisation of the volume.
      - ../postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

# Two passwords (owner role and restricted role ppf_app), each in one file per container user
# (10001 for the server and the migrations, 999 for PostgreSQL): file secrets are bind mounts, so
# Compose cannot change their owner. All four files are written by infra/scripts/bootstrap-server.sh.
secrets:
  server_db_password:
    file: ${PPF_SECRETS_DIR:?}/server_db_password
  # VAPID private key of the push wake-ups (EC P-256, PKCS#8 PEM), readable by the server only.
  vapid_private_key:
    file: ${PPF_SECRETS_DIR:?}/vapid_private_key
  # Signing service (D-129): key-encryption key and the token the server presents (two files, same
  # token, one per container user).
  signer_kek:
    file: ${PPF_SECRETS_DIR:?}/signer_kek
  signer_client_token:
    file: ${PPF_SECRETS_DIR:?}/signer_client_token
  server_signer_token:
    file: ${PPF_SECRETS_DIR:?}/server_signer_token
  migrate_db_password:
    file: ${PPF_SECRETS_DIR:?}/migrate_db_password
  db_password:
    file: ${PPF_SECRETS_DIR:?}/db_password
  app_db_password:
    file: ${PPF_SECRETS_DIR:?}/app_db_password
  # Import key of the parliamentary open data (nsec file, UID 10003); empty until the public launch.
  import_key:
    file: ${PPF_SECRETS_DIR:?}/import_key

volumes:
  db-data:

networks:
  # The database network has no way out.
  internal:
    internal: true
  # Between the server and the signing service only, no way out.
  signing:
    internal: true
  # Between the proxy and the approval pages of the signing service only, no way out; created once by
  # infra/scripts/bootstrap-server.sh.
  approval:
    external: true
    name: ppf-prod-approval
  # Shared with the proxy only; created once by infra/scripts/bootstrap-server.sh.
  edge:
    external: true
    name: ppf-prod-edge
  # The importer's own network, with a way out to the official sources only.
  importer: {}
