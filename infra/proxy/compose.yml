# Reverse proxy, the only process exposed to the Internet. Its own Compose project, started by
# infra/scripts/deploy.sh:
#   docker compose -f infra/proxy/compose.yml --env-file /srv/ppf/proxy/.env up -d
# It joins the edge network of each environment; it never reaches the databases.

name: ppf-proxy

services:
  caddy:
    # Pinned by digest (Dependabot proposes updates).
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PPF_DOMAIN: ${PPF_DOMAIN:?}
      PREPROD_BASIC_AUTH_USER: ${PREPROD_BASIC_AUTH_USER:?}
      PREPROD_BASIC_AUTH_HASH: ${PREPROD_BASIC_AUTH_HASH:?}
    volumes:
      # Caddyfile and the sites actually deployed, copied there by infra/scripts/deploy.sh
      # (a directory, not single files, so that an update is seen by the running container).
      - /srv/ppf/proxy/conf:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      - prod-edge
      - preprod-edge
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  caddy-data:
  caddy-config:

networks:
  # Both created once by infra/scripts/bootstrap-server.sh, so that the proxy starts even
  # before the production exists.
  prod-edge:
    external: true
    name: ppf-prod-edge
  preprod-edge:
    external: true
    name: ppf-preprod-edge
