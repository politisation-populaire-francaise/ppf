# Gradle
# Parallel GC: faster for builds and avoids the G1 concurrent-thread crashes seen twice on the owner's computer (2026-11-06).
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
# iOS targets are declared (the code must stay iOS-compatible) but they can only be
# compiled on macOS. On other hosts they are silently skipped.
kotlin.native.ignoreDisabledTargets=true
# The Kotlin/Native "commonizer" (which merges the iOS platform libraries for the shared iosMain
# source set) crashes on Windows with Kotlin 2.4.21 and is useless there. Disabled by default;
# macOS builds pass -Pkotlin.mpp.enableNativeDistributionCommonization=true on the command line.
kotlin.mpp.enableNativeDistributionCommonization=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
