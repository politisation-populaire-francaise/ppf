# Automatic dependency updates, one pull request per update, reviewed like any other change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: ci
  # Base image of the server (pinned by digest).
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: build
  # PostgreSQL/PostGIS and Caddy images of the Compose projects (pinned by digest).
  - package-ecosystem: docker-compose
    directories:
      - /infra/preproduction
      - /infra/production
      - /infra/proxy
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: build
