# Automatic dependency updates, one pull request per update, reviewed like any other change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: ci
  # Base image of the server (pinned by digest).
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: build
    # A major version (Java 21 to 25, PostgreSQL 17 to 18) is a decision with a data
    # migration, taken by hand: only minor and patch updates are proposed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # PostgreSQL/PostGIS and Caddy images of the Compose projects (pinned by digest).
  - package-ecosystem: docker-compose
    directories:
      - /infra/preproduction
      - /infra/production
      - /infra/proxy
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: build
    # A major version (Java 21 to 25, PostgreSQL 17 to 18) is a decision with a data
    # migration, taken by hand: only minor and patch updates are proposed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
